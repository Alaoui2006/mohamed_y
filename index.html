<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --card:#111; --line:#2a2a2a; --text:#fff; --muted:#b5b5b5; --orange:#e0742a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,sans-serif;
  background:var(--bg) radial-gradient(circle at 50% 0%,#3a1a0a 0,#000 55%)}
.wrap{max-width:440px;margin:0 auto;padding:28px 20px 40px;text-align:center}

.photo{width:170px;height:170px;margin:0 auto;border-radius:50%;animation:rise .8s backwards,glow 4s ease-in-out 1s infinite}
.photo>div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#1a0f08;display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover;display:none}
.photo span{font-family:"Cormorant Garamond",Georgia,serif;font-size:2.6rem;font-weight:600}

h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:2rem;font-weight:600;margin:18px 0 4px;letter-spacing:.04em;animation:rise .8s .15s backwards}
.title{margin:0;color:var(--muted);font-size:.9rem;animation:rise .8s .25s backwards}
.company{margin:4px 0 0;color:var(--orange);font-size:.8rem;letter-spacing:.25em;text-transform:uppercase;animation:rise .8s .3s backwards}
.title:empty,.company:empty{display:none}

.divider{display:flex;align-items:center;gap:10px;justify-content:center;margin:22px 0;animation:rise .8s .4s backwards}
.divider::before,.divider::after{content:"";height:1px;width:70px;background:var(--orange)}
.divider svg{transform-origin:50% 90%;animation:flicker 1.6s ease-in-out infinite}

.save{position:relative;overflow:hidden;width:100%;border:0;cursor:pointer;font:600 .95rem Inter,system-ui,sans-serif;letter-spacing:.04em;
  color:#1a0b03;background:var(--orange);border-radius:14px;padding:15px 18px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:center;gap:10px;animation:rise .6s .5s backwards;transition:transform .2s,box-shadow .2s,background .2s}
.save:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(224,116,42,.3)}
.save:active{transform:scale(.97)}
.save.done{background:#fff}
.save svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:ripple .6s linear;pointer-events:none}

.btn{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--text);
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;
  animation:rise .6s var(--d,.6s) backwards;transition:transform .15s,border-color .15s}
.btn:hover,.btn:active{transform:translateY(-2px);border-color:var(--orange)}
.btn:nth-of-type(1){--d:.6s}.btn:nth-of-type(2){--d:.72s}.btn:nth-of-type(3){--d:.84s}
.btn:nth-of-type(4){--d:.96s}.btn:nth-of-type(5){--d:1.08s}.btn:nth-of-type(6){--d:1.2s}.btn:nth-of-type(7){--d:1.32s}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#1d1d1d;flex:none;transition:background .2s,color .2s}
.btn:hover .ico{background:var(--orange);color:#1a0b03}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn small,.rib small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.btn span{font-weight:500;font-size:.95rem;word-break:break-all}

.rib{display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:12px;padding:14px 16px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);animation:rise .6s 1.45s backwards;transition:border-color .15s}
.rib:hover{border-color:var(--orange)}
.rib>div:first-child{flex:1;min-width:0}
.rib b{display:block;margin-top:3px;font-weight:600;font-size:.92rem;letter-spacing:.05em;font-variant-numeric:tabular-nums;word-break:break-all}
.copy{flex:none;display:flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--orange);background:transparent;color:var(--orange);
  font:600 .82rem Inter,system-ui,sans-serif;border-radius:10px;padding:9px 12px;transition:background .2s,color .2s,transform .15s}
.copy svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.copy:hover,.copy.done{background:var(--orange);color:#1a0b03}
.copy:active{transform:scale(.94)}

footer{margin-top:26px;color:var(--muted);font-size:.75rem;animation:rise .8s 1.6s backwards}

@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 30px rgba(224,116,42,.15)}50%{box-shadow:0 0 55px rgba(224,116,42,.38)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}30%{transform:scale(1.15,1.28) rotate(2deg)}60%{transform:scale(.95,1.1) rotate(-1deg)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">

  <div class="photo"><div>
    <img id="photo" alt="Logo">
    <span id="initials"></span>
  </div></div>

  <h1 id="fullname"></h1>
  <p class="title" id="jobtitle"></p>
  <p class="company" id="company"></p>

  <div class="divider"><svg viewBox="0 0 24 24" width="20" height="20" fill="#e0742a" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div>

  <button class="save" id="saveBtn" type="button">
    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    <span id="saveLabel">Enregistrer le contact</span>
  </button>

  <div id="links"></div>

  <div class="rib" id="ribBox" hidden>
    <div><small>RIB</small><b id="ribText"></b></div>
    <button class="copy" id="copyBtn" type="button" aria-live="polite">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <em style="font-style:normal">Copier</em>
    </button>
  </div>

  <footer id="footer"></footer>
</main>

/* ---------- Ne touche pas en dessous ---------- */
const ICONS = {
  whatsapp:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l1.9-5.4A8.4 8.4 0 1 1 21 11.5z"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
  facebook:'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>'
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fullName = (C.firstName + " " + C.lastName).trim();
const digits = C.phoneIntl.replace(/\D/g,"");
const handle = C.instagram ? "@" + C.instagram.replace(/\/+$/,"").split("/").pop().split("?")[0] : "";

document.title = fullName;
document.getElementById("fullname").textContent = fullName;
document.getElementById("jobtitle").textContent = C.title;
document.getElementById("company").textContent = C.company;
document.getElementById("footer").textContent = "© " + (C.company || fullName);
document.getElementById("initials").textContent = ((C.firstName[0]||"") + (C.lastName[0]||"")).toUpperCase();
if (C.photo) {
  const img = document.getElementById("photo");
  img.onload = () => { img.style.display = "block"; document.getElementById("initials").style.display = "none"; };
  img.src = C.photo;
}

const items = [
  C.phoneIntl && ["whatsapp","WhatsApp",C.phone,"https://wa.me/"+digits,true],
  C.phoneIntl && ["phone","Téléphone",C.phone,"tel:"+C.phoneIntl,false],
  C.instagram && ["instagram","Instagram",handle,C.instagram,true],
  C.facebook  && ["facebook","Facebook",C.facebook.replace(/\/+$/,"").split("/").pop().split("?")[0],C.facebook,true],
  C.email     && ["mail","E-mail",C.email,"mailto:"+C.email,false],
  C.website   && ["globe","Site web",C.website.replace(/^https?:\/\//,""),C.website,true],
  (C.location || C.maps) && ["pin","Localisation",C.location || "Google Maps",C.maps || ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(C.location)),true]
].filter(Boolean);

document.getElementById("links").innerHTML = items.map(([ic,label,text,href,ext]) =>
  `<a class="btn" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener"' : ""}>
     <div class="ico"><svg viewBox="0 0 24 24">${ICONS[ic]}</svg></div>
     <div><small>${label}</small><span>${esc(text)}</span></div>
   </a>`).join("");

/* RIB : copier en un clic */
if (C.rib) {
  document.getElementById("ribBox").hidden = false;
  document.getElementById("ribText").textContent = C.rib;
  const btn = document.getElementById("copyBtn"), lbl = btn.querySelector("em");
  btn.addEventListener("click", async () => {
    const value = C.rib.replace(/\s+/g,"");
    let ok = false;
    try { await navigator.clipboard.writeText(value); ok = true; } catch (e) {}
    if (!ok) {
      const t = document.createElement("textarea");
      t.value = value; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      try { ok = document.execCommand("copy"); } catch (e) {}
      t.remove();
    }
    lbl.textContent = ok ? "Copié ✓" : "Erreur";
    btn.classList.toggle("done", ok);
    setTimeout(() => { lbl.textContent = "Copier"; btn.classList.remove("done"); }, 2200);
  });
}

/* Enregistrer le contact (.vcf) : nom, tel, e-mail, adresse, Instagram, photo */
const fold = l => { const out = []; while (l.length > 75) { out.push(l.slice(0,75)); l = " " + l.slice(75); } out.push(l); return out.join("\r\n"); };
document.getElementById("saveBtn").addEventListener("click", () => {
  const photo64 = C.photo.startsWith("data:") ? C.photo.split(",")[1] : "";
  const lines = ["BEGIN:VCARD","VERSION:3.0",
    "N:" + C.lastName + ";" + C.firstName + ";;;",
    "FN:" + fullName,
    C.company   && "ORG:" + C.company,
    C.title     && "TITLE:" + C.title,
    /\d{8,}/.test(C.phoneIntl) && "TEL;TYPE=CELL:" + C.phoneIntl,
    C.email.includes("@") && "EMAIL;TYPE=INTERNET:" + C.email,
    C.website   && "URL:" + C.website,
    C.location  && "ADR;TYPE=WORK:;;;" + C.location.split(",")[0].trim() + ";;;" + (C.location.split(",")[1] || "").trim(),
    C.instagram && "X-SOCIALPROFILE;TYPE=instagram:" + C.instagram,
    C.facebook  && "X-SOCIALPROFILE;TYPE=facebook:" + C.facebook,
    photo64     && "PHOTO;ENCODING=b;TYPE=JPEG:" + photo64,
    "END:VCARD"].filter(Boolean).map(fold).join("\r\n");
  const blob = new Blob([lines], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fullName.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
});
/* Effet au clic sur Enregistrer */
document.getElementById("saveBtn").addEventListener("click", e => {
  const b = e.currentTarget, r = b.getBoundingClientRect(), d = Math.max(r.width, r.height);
  const rp = document.createElement("span");
  rp.className = "ripple";
  rp.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d/2) + "px;top:" + (e.clientY - r.top - d/2) + "px";
  b.appendChild(rp); setTimeout(() => rp.remove(), 650);
  const lbl = document.getElementById("saveLabel");
  lbl.textContent = "Contact téléchargé ✓"; b.classList.add("done");
  setTimeout(() => { lbl.textContent = "Enregistrer le contact"; b.classList.remove("done"); }, 2400);
});
</script>
